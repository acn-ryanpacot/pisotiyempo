name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Checks gradle-wrapper.jar against Gradle's published checksums before running it.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (shared core and Android)
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: piso-tiyempo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

  desktop:
    # The MSI installer can only be built on Windows (jpackage + WiX, which the Compose plugin downloads).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop tests
        run: ./gradlew :desktop:test --stacktrace
      - name: Build Windows installer
        run: ./gradlew :desktop:packageMsi --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: piso-tiyempo-windows-installer
          path: desktop/build/compose/binaries/main/msi/*.msi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-report
          path: desktop/build/reports/tests/
